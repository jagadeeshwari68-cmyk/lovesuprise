<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ A Message Just For You ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<div class="container">

    <img src="image.jpg" class="profile">

    <h1>❤️ Hey My Love ❤️</h1>

    <h2>Someone Special Has Sent You A Private Message</h2>

    <p>
        Before you continue...
        <br><br>
        Promise you'll read till the end ❤️
    </p>

    <button id="openBtn">
        Open My Heart 💌
    </button>

</div>

<!-- Hidden Love Letter -->

<div class="letter hidden">

<h1>💖 My Love 💖</h1>

<p id="typing"></p>

<div class="buttons">

<button id="forgive">
❤️ Forgive Me
</button>

<button id="ignore">
💔 Ignore Me
</button>

</div>

</div>

<!-- Video Popup -->

<div id="popup" class="popup hidden">

<div class="popup-content">

<h2>I Love You ❤️</h2>

<iframe
width="100%"
height="315"
src="https://www.youtube.com/embed/MT99Kwx35eo"
allowfullscreen>
</iframe>

<button id="close">
Close ❤️
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
